# supabase.reeldemo.io HTTPS — Kong + token-gated lead-magnet downloads.
# Backend Kong: k3s NodePort 30592 (namespace reeldemo-supabase-prod).
# Lead magnet: 127.0.0.1:8791 (reeldemo-leadmagnet.service).

    upstream reeldemo_supabase_kong {
        server 127.0.0.1:30592;
        keepalive 8;
    }

    upstream reeldemo_leadmagnet {
        server 127.0.0.1:8791;
        keepalive 4;
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name supabase.reeldemo.io;

        ssl_certificate     /etc/letsencrypt/live/supabase.reeldemo.io/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/supabase.reeldemo.io/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers off;

        client_max_body_size 50m;
        proxy_read_timeout 120s;

        location = /health {
            default_type text/plain;
            return 200 "ok\n";
        }

        location /leadmagnet/ {
            proxy_pass http://reeldemo_leadmagnet;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
            proxy_buffering off;
            proxy_read_timeout 600s;
            proxy_send_timeout 600s;
        }

        # Validated by leadmagnet service via X-Accel-Redirect.
        location /internal/leadmagnet/ {
            internal;
            alias /var/lib/reeldemo-leadmagnet/;
            add_header Content-Disposition 'attachment; filename="reelsynth-genre-tables-500.zip"';
            add_header Cache-Control "no-store";
        }

        location / {
            proxy_pass http://reeldemo_supabase_kong;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
            proxy_set_header Accept-Encoding "";
            proxy_buffering off;
        }
    }
